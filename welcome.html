<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scrcodes.com - Welcome Gateway</title>

    <!-- Tailwind CSS & Font Awesome Icons CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a;
        }
        .font-code { font-family: 'Fira Code', monospace; }
        .bg-grid-pattern {
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-grid-pattern min-h-screen text-slate-100 flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div id="brandHeaderBtn" class="flex items-center space-x-3 cursor-pointer">
                <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-code text-base"></i>
                </div>
                <div>
                    <span class="text-sm font-bold text-white tracking-tight font-code">scrcodes.com</span>
                    <span class="block text-[10px] text-slate-400">Developer Portal Gateway</span>
                </div>
            </div>
            
            <!-- Top Right System Status Indicator -->
            <div class="flex items-center space-x-2 bg-slate-950/80 px-3 py-1.5 rounded-full border border-slate-800">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span class="text-[11px] font-code text-slate-300">System Online</span>
            </div>
        </div>
    </header>

    <!-- Welcome Choice Card -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-12 flex items-center justify-center">
        <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-xl rounded-2xl border border-slate-800 shadow-2xl p-8 relative overflow-hidden text-center">
            
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-indigo-500"></div>

            <div class="w-16 h-16 bg-slate-800 rounded-2xl flex items-center justify-center mx-auto mb-4 text-indigo-400 border border-slate-700">
                <i class="fa-solid fa-laptop-code text-2xl"></i>
            </div>

            <h1 class="text-2xl font-bold text-white tracking-tight">Welcome to scrcodes</h1>
            <p class="text-xs text-slate-400 mt-2 mb-8">Do you need to create a new developer account, or do you already have one?</p>

            <div class="space-y-4 font-code text-xs">
                <!-- Option 1: Create Account -->
                <button id="btnCreateAccount" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3.5 rounded-xl transition cursor-pointer shadow-lg shadow-indigo-600/20 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-user-plus text-sm"></i>
                    <span>I Need to Create an Account</span>
                </button>

                <!-- Option 2: Already Have Account -->
                <button id="btnAlreadyHaveAccount" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium py-3.5 rounded-xl transition cursor-pointer flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-right-to-bracket text-sm text-indigo-400"></i>
                    <span>I Already Have an Account</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Footer with working link back to welcome.html -->
    <footer class="w-full border-t border-slate-800/60 bg-slate-950/50 py-4 text-center text-xs text-slate-500 font-code">
        <a href="welcome.html" class="hover:text-indigo-400 transition">&copy; 2026 scrcodes.com. All rights reserved.</a>
    </footer>

    <script>
        document.getElementById('brandHeaderBtn').addEventListener('click', () => {
            window.location.href = "welcome.html";
        });

        document.getElementById('btnCreateAccount').addEventListener('click', () => {
            window.location.href = "signup.html";
        });

        document.getElementById('btnAlreadyHaveAccount').addEventListener('click', () => {
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
