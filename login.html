<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scrcodes.com - Sign In</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #0f172a; }
        .font-code { font-family: 'Fira Code', monospace; }
        .bg-grid-pattern { background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px); background-size: 24px 24px; }
    </style>
</head>
<body class="bg-grid-pattern min-h-screen text-slate-100 flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div id="brandHeaderBtn" class="flex items-center space-x-3 cursor-pointer">
                <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-code text-base"></i>
                </div>
                <div>
                    <span class="text-sm font-bold text-white tracking-tight font-code">scrcodes.com</span>
                    <span class="block text-[10px] text-slate-400">Sign In</span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button id="navBackHome" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 font-code transition cursor-pointer">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Back to Gateway Page
                </button>

                <div class="flex items-center space-x-2 bg-slate-950/80 px-3 py-1.5 rounded-full border border-slate-800">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span class="text-[11px] font-code text-slate-300">System Online</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Sign In Form -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-12 flex items-center justify-center">
        <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-xl rounded-2xl border border-slate-800 shadow-2xl p-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-indigo-500"></div>

            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-slate-800 rounded-2xl flex items-center justify-center mx-auto mb-3 text-indigo-400 border border-slate-700">
                    <i class="fa-solid fa-right-to-bracket text-xl"></i>
                </div>
                <h1 class="text-xl font-bold text-white tracking-tight">Access Workspace</h1>
                <p class="text-xs text-slate-400 mt-1">Authenticate with your username</p>
            </div>

            <form id="signInForm" onsubmit="return false;" class="space-y-4 font-code text-xs">
                <div>
                    <label class="block text-slate-300 mb-1">Username</label>
                    <input id="loginUsername" type="text" required placeholder="owner" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-slate-300 mb-1">Password</label>
                    <input id="loginPassword" type="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500">
                </div>

                <div id="signInError" class="hidden p-3 bg-red-950/60 border border-red-800/50 rounded-xl text-red-300"></div>

                <button id="submitLoginBtn" type="button" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition cursor-pointer shadow-lg shadow-indigo-600/20 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-key text-xs"></i>
                    <span>Authenticate</span>
                </button>

                <button id="navSignUpDirect" type="button" class="w-full text-center text-slate-400 hover:text-indigo-400 pt-2 transition cursor-pointer block">
                    Need an account? <span class="underline">Create account</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-slate-800/60 bg-slate-950/50 py-4 text-center text-xs text-slate-500 font-code">
        <a href="welcome.html" class="hover:text-indigo-400 transition">&copy; 2026 scrcodes.com. All rights reserved.</a>
    </footer>

    <script>
        document.getElementById('brandHeaderBtn').addEventListener('click', () => { window.location.href = "welcome.html"; });
        document.getElementById('navBackHome').addEventListener('click', () => { window.location.href = "welcome.html"; });
        document.getElementById('navSignUpDirect').addEventListener('click', () => { window.location.href = "signup.html"; });

        const SUPABASE_URL = "https://uzoqpebcgteyfqymrvom.supabase.co";
        const SUPABASE_KEY = "sb_publishable_PMobZpTzx3p_bXcgctDysw_SNLMY8qU";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const submitBtn = document.getElementById('submitLoginBtn');
        const signInError = document.getElementById('signInError');

        submitBtn.addEventListener('click', async () => {
            signInError.classList.add('hidden');

            const rawUsername = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!rawUsername || !password) {
                signInError.textContent = "Please fill in both username and password.";
                signInError.classList.remove('hidden');
                return;
            }

            const formattedEmail = `${rawUsername.toLowerCase().replace(/\s+/g, '')}@scrcodes.com`;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: formattedEmail,
                password: password
            });

            if (error) {
                signInError.textContent = error.message;
                signInError.classList.remove('hidden');
                return;
            }

            if (data.session) {
                window.location.href = "homepage.html";
            }
        });
    </script>
</body>
</html>
